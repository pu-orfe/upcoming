name: Tests

# The pipeline workflows run pytest too, but only on main (scheduled) or on
# manual dispatch, so pull requests previously carried no test signal at all.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: pytest -q
      # Run the simulator's suite explicitly too: the pytest bridge skips it when
      # node is absent, and a skip must not be how this coverage disappears.
      # Explicit files, not the directory: `node --test <dir>` needs Node 24+,
      # and the runners ship Node 22.
      - run: node --test tests/js/*.test.js

  container:
    # Proves the containerized path keeps working, so `make docker-test` cannot rot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f docker-compose.yml run --rm tests
